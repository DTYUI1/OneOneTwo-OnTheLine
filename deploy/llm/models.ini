; Пресеты роутера llama.cpp (llama-server --models-preset). Имя раздела — <модель>-<режим>,
; модели — data/ai-models.json. Общие параметры — в [*]; файлы — в ../models (том /models).
; Режим gpu работает только на образе llama.cpp с CUDA и с доступом контейнера к видеокарте
; (scripts/stand/up.sh включает его сам, если видеокарта рабочая).

[*]
ctx-size = 4096
threads = 8
threads-batch = 8
parallel = 1
cont-batching = true
cache-prompt = true
jinja = true

[qwen3-4b-cpu]
model = /models/qwen3-4b-instruct-2507-q4_k_m.gguf
n-gpu-layers = 0
device = none

[qwen3-4b-gpu]
model = /models/qwen3-4b-instruct-2507-q4_k_m.gguf
n-gpu-layers = 99

[gemma4-26b-a4b-cpu]
; Gemma 4 по умолчанию «размышляет» и тратит весь лимит токенов на рассуждения.
chat-template-kwargs = {"enable_thinking": false}
model = /models/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
n-gpu-layers = 0
device = none

[gemma4-26b-a4b-gpu]
; Gemma 4 по умолчанию «размышляет» и тратит весь лимит токенов на рассуждения.
chat-template-kwargs = {"enable_thinking": false}
model = /models/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
n-gpu-layers = 99
