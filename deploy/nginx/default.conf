map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    server_name _;
    location = /healthz { access_log off; return 200 'ok'; }
    location / { return 302 https://$host:8443$request_uri; }
}
server {
    listen 443 ssl;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;
    # Относительные redirects сохраняют внешний порт 8443 при Docker port mapping.
    absolute_redirect off;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    client_max_body_size 10m;
    location = / { return 302 /app/login; }
    location = /teacher { return 302 /app/teacher; }
    location = /admin { return 302 /app/admin; }
    location = /app { return 302 /app/; }
    location /app/ { try_files $uri $uri/ /app/index.html; }
    location /api/ { proxy_pass http://$api_upstream$request_uri; proxy_set_header Host $http_host; }
    location /ws {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 60s;
    }
    location / { try_files $uri $uri/ =404; }
}
