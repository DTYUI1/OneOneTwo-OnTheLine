name: Проверки каркаса
# Минуты Actions ограничены: полный прогон — на PR и после слияния в main,
# без повторного прогона на каждый push ветки и без ночного расписания.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: arm112
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: arm112_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arm112 -d arm112_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL_TEST: postgresql+asyncpg://arm112:ci-test-only@127.0.0.1:5432/arm112_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.8.22'}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20.19.5', cache: pnpm}
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy
      - run: uv run --all-packages pytest -q
      - run: uv run --package arm112-api python -m app.tools.export_openapi --check
      - run: pnpm install --frozen-lockfile
        env: {SCARF_ANALYTICS: 'false'}
      - run: pnpm gen:api && git diff --exit-code -- apps/web/src/api-client
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - name: Проверить ответы Prism
        run: |
          pnpm mock > "$RUNNER_TEMP/prism.log" 2>&1 &
          prism_pid=$!
          trap 'kill "$prism_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4010/health > /dev/null; then break; fi
            sleep 1
          done
          uv run --package arm112-scripts python scripts/check_prism.py
      - run: docker compose config --quiet
      - run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml --profile dev config --quiet
      - run: docker compose --profile mock --profile llm config --quiet
  compose-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20.19.5', cache: pnpm}
      - run: pnpm install --frozen-lockfile
        env: {SCARF_ANALYTICS: 'false'}
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: docker compose up --build --wait --wait-timeout 300
      - run: pnpm test:e2e
        env: {E2E_BASE_URL: 'https://localhost:8443'}
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: playwright-results, path: qa/results}
  database-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: arm112-ci-database
      API_MODE: database
      AI_PROVIDER: 'off'
      JWT_SECRET: ci-isolated-database-only-secret-not-for-production
      DEMO_PASSWORD: demo-local
      E2E_DATABASE: '1'
      E2E_BASE_URL: https://localhost:8443
      E2E_RECOVERY_PROJECT: arm112-ci-database
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20.19.5', cache: pnpm}
      - run: pnpm install --frozen-lockfile
        env: {SCARF_ANALYTICS: 'false'}
      - run: pnpm exec playwright install --with-deps chromium firefox
      - name: Собрать свежие образы и подготовить отдельную БД
        run: |
          docker compose build api web
          docker compose up -d --wait db
          docker compose up -d --wait migrate
          docker compose run --rm --no-deps api python -m app.seed
          docker compose run --rm --no-deps api python -m app.seed.training
          docker compose up -d --wait --wait-timeout 300 api worker web
      - name: Проверить весь браузерный набор на свежей БД
        run: pnpm exec playwright test -c qa/playwright.config.ts --workers=1 --forbid-only --output=qa/results/clean
      - name: Зафиксировать историю и проверить повторный запуск
        run: |
          python3 qa/smoke/c01_history.py capture --project arm112-ci-database --manifest qa/results/history-before.json
          docker compose restart api
          docker compose up -d --wait --wait-timeout 120 api worker web
          docker compose exec -T web nginx -s reload
      - name: Проверить весь набор на сохранённой истории
        run: |
          pnpm exec playwright test -c qa/playwright.config.ts --workers=1 --forbid-only --output=qa/results/history
          python3 qa/smoke/c01_history.py verify --project arm112-ci-database --manifest qa/results/history-before.json
      - name: Сохранить диагностику
        if: always()
        run: docker compose logs --no-color > database-compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-e2e-results
          path: |
            qa/results
            database-compose.log
      - if: always()
        run: docker compose down
