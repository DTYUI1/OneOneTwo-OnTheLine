# Замеры C-09: отдельный Compose-проект arm112-bench со своими томами и портами.
# Образы с тегом ${BENCH_TAG:-bench}, чтобы не задеть образы рабочего стенда.
services:
  migrate:
    image: arm112-api:${BENCH_TAG:-bench}
  api:
    image: arm112-api:${BENCH_TAG:-bench}
  worker:
    image: arm112-api:${BENCH_TAG:-bench}
    environment:
      # Судья на CPU отвечает 15–30 с; запас, чтобы медленная машина не давала partial.
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
  certs:
    image: arm112-api:${BENCH_TAG:-bench}
  web:
    image: arm112-web:${BENCH_TAG:-bench}
    ports: !override ['127.0.0.1:${BENCH_HTTP_PORT:-44080}:80', '127.0.0.1:${BENCH_HTTPS_PORT:-44443}:443']
